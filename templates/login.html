<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <div class="brand" style="margin-bottom: 1.25rem;">
        <div class="brand-mark">JU</div>
        <div>
          <h1>{{ app_name }}</h1>
          <p>Espace privé — upload de reçus Ulys</p>
        </div>
      </div>

      {% if error %}
      <div class="error">Mot de passe incorrect.</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label for="password">Mot de passe administrateur</label>
          <input id="password" name="password" type="password" required autofocus autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Se connecter</button>
      </form>

      <p class="muted small" style="margin-top:1rem">
        Les destinataires de vos justificatifs n’ont <strong>pas besoin</strong> de ce mot de passe
        ni d’un compte Ulys : ils utilisent uniquement le lien public du dossier.
      </p>
    </div>
  </div>
</body>
</html>
